version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nlreturn
    - revive
    - unconvert
    - whitespace
    - wsl_v5
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/brian-nunez/psv

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
