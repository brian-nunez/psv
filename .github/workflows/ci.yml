name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The example-video, CLI and API tests decode video with FFmpeg.
      - name: Install FFmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          ffmpeg -version | head -n 1

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - name: Format
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Test on 32-bit
        run: make test-386

      - name: Fuzz the detector against its model
        run: make fuzz FUZZTIME=15s

      - name: Test release scripts
        run: make test-scripts

      - name: Build release binaries
        run: make release

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::The build changed tracked files. Run make fmt, go mod tidy or make examples and commit the result."
            exit 1
          fi

  proofs:
    name: Lean proofs and model vectors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELAN_VERSION: v4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - uses: actions/checkout@v7

      # elan installs the Lean version pinned in proofs/lean-toolchain.
      - name: Install elan
        run: |
          curl -sSfL -o elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          rm elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check proofs
        run: make proofs

      - name: Regenerate model vectors
        run: make model-vectors

      - name: Check the model vectors are current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::testdata/model/vectors.json differs from the Lean model. Run make model-vectors and commit the result."
            exit 1
          fi
