name: Release

# Runs after CI passes on a push to main. The next version comes from the Conventional Commits since
# the last tag (scripts/next-version.sh); when there is nothing to release, the job stops early.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the next version
        id: version
        run: |
          version=$(scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ -z "$version" ]; then
            echo "::notice::Nothing to release: no feat, fix or other releasable commits since the last tag."
          elif git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists."
            exit 1
          else
            echo "::notice::Releasing $version from $SHA"
          fi

      - uses: actions/setup-go@v7
        if: steps.version.outputs.version != ''
        with:
          go-version-file: go.mod

      - name: Build binaries and checksums
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make dist VERSION="$VERSION"

      - name: Verify binaries
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS)

          # The runner can execute the linux/amd64 binary; every binary is built with the same flags.
          out=$(dist/psv-linux-amd64 -version)
          echo "$out"

          if [ "$out" != "psv $VERSION" ]; then
            echo "::error::dist/psv-linux-amd64 reports '$out', expected 'psv $VERSION'"
            exit 1
          fi

      - name: Create tag and release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/psv-* dist/SHA256SUMS \
            --target "$SHA" \
            --title "psv $VERSION" \
            --generate-notes
